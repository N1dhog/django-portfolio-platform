{% load static %}
<!DOCTYPE html>
<html lang="ka">
    <head> 
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <title>Gallery.Ge</title>

        <link rel="stylesheet" type="text/css" href="https://bootswatch.com/5/flatly/bootstrap.min.css">
        
        <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />

        <link rel="stylesheet" type="text/css" href="{% static 'css/styles.css' %}">
        <link rel="stylesheet" type="text/css" href="{% static 'css/footer.css' %}">
        <link rel="stylesheet" type="text/css" href="{% static 'css/navbar.css' %}">
        <link rel="stylesheet" type="text/css" href="{% static 'css/projects.css' %}">
        <link rel="stylesheet" type="text/css" href="{% static 'css/explore.css' %}">
        <link rel="stylesheet" type="text/css" href="{% static 'css/index.css' %}">
        <link rel="stylesheet" type="text/css" href="{% static 'css/light_mode.css' %}">
        <link rel="stylesheet" type="text/css" href="{% static 'css/cursor_style.css' %}">

        <script src="https://kit.fontawesome.com/6abd0ed417.js" crossorigin="anonymous"></script>
    </head>

    <body>
        <div class="custom-cursor-dot"></div>
        <div class="custom-cursor-outline"></div>

        {% include 'webapp/navbar.html' %}

        <div id="django-messages-container" class="container mt-3">
    {% for message in messages %}
        {% if message.level == DEFAULT_MESSAGE_LEVELS.SUCCESS %}
        <div class="message-text d-flex justify-content-center">
            <p id="message-timer" class="alert alert-success text-center px-4 py-2 shadow-sm rounded-pill"> 
                <i class="fa fa-check" aria-hidden="true"></i> &nbsp; {{ message }}
            </p>
        </div>
        {% endif %}
    {% endfor %}
</div>

        <main>
            {% block content %}
            {% endblock %}
        </main>

        {% include 'webapp/footer.html' %}
       
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        
        <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

        <script src="{% static 'js/cursor_style.js' %}"></script>
        <script src="{% static 'js/explore.js' %}"></script>
        <script src="{% static 'js/light_mode.js' %}"></script>
        <script src="{% static 'js/projects.js' %}"></script> 
        <script src="{% static 'js/app.js' %}"></script> 
        
    </body>
</html>
